name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allohub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Backend tests (PostgreSQL)
        run: cd back && chmod +x gradlew && ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AI service smoke
        run: |
          cd ai-service
          pip install -r requirements.txt
          python -c "from app.main import app; from app.evidence import query_evidence; from app.schemas import EvidenceQueryRequest; print(query_evidence(EvidenceQueryRequest(companyName='test')).status)"

      - name: Frontend build
        run: npm run build -w front
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_API_BASE: "/api"
