name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allohub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Backend tests (PostgreSQL)
        run: cd back && chmod +x gradlew && ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Frontend build (local paths)
        run: npm run build -w front
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_API_BASE: "/api"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/my-portfolio"
            cd "$DEPLOY_DIR"

            # AlloHub 소스가 하위 폴더인 경우 (없으면 my-portfolio 루트)
            if [ -d AlloHub_portfolio ]; then
              APP_DIR="$DEPLOY_DIR/AlloHub_portfolio"
            elif [ -d allohub ]; then
              APP_DIR="$DEPLOY_DIR/allohub"
            else
              APP_DIR="$DEPLOY_DIR"
            fi
            cd "$APP_DIR"
            echo "Deploy dir: $APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env 가 없습니다. EC2에서 먼저 .env 를 만드세요."
              exit 1
            fi

            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              echo "WARN: $APP_DIR 가 git 저장소가 아닙니다. 현재 파일로 compose만 재기동합니다."
            fi

            # DB/nginx는 유지, 앱만 재빌드 (없으면 기동)
            docker compose up -d allohub-db || true
            docker compose up -d --build allohub-app allohub-web
            docker compose up -d nginx || true
            docker image prune -f

            echo "Waiting for health..."
            sleep 20
            curl -sf http://localhost:8080/actuator/health || curl -sf http://localhost/health || true
            curl -sf http://localhost/allohub/ >/dev/null
            docker compose ps
