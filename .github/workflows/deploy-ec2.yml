name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Backend tests
        run: cd back && chmod +x gradlew && ./gradlew test

      - name: Frontend build (local paths)
        run: npm run build -w front
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_API_BASE: "/api"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/ubuntu/allohub

            if [ ! -f .env ]; then
              echo "ERROR: /home/ubuntu/allohub/.env 가 없습니다. EC2에서 먼저 .env 를 만드세요."
              exit 1
            fi

            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              echo "ERROR: /home/ubuntu/allohub 가 git 저장소가 아닙니다."
              exit 1
            fi

            docker compose pull || true
            docker compose up -d --build
            docker image prune -f

            echo "Waiting for health..."
            sleep 20
            curl -sf http://localhost:8080/actuator/health || curl -sf http://localhost/health
            curl -sf http://localhost/allohub/ >/dev/null
            docker compose ps
