name: Deploy EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allohub_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Backend tests (PostgreSQL)
        run: cd back && chmod +x gradlew && ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Frontend build (local paths)
        run: npm run build -w front
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_API_BASE: "/api"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          debug: true
          script: |
            set -euxo pipefail
            pwd
            whoami
            ls -al /home/${{ secrets.EC2_USER }}
            cd /home/${{ secrets.EC2_USER }}/my-portfolio
            git status
            docker compose config --services
            docker compose ps
            docker compose pull allohub-app allohub-web
            docker compose up -d allohub-app allohub-web
            docker compose ps
            sleep 15
            curl -sf http://localhost:8080/actuator/health || curl -sf http://localhost/health || true
            curl -sf http://localhost/allohub/ || true
