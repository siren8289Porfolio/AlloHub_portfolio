# AlloHub MVP — EC2: /home/ubuntu/allohub
# 순서: db → back → front → nginx

services:
  db:
    image: postgres:14-alpine
    container_name: allohub-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-allohub}
      POSTGRES_USER: ${DB_USER:-allohub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - allohub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-allohub} -d ${DB_NAME:-allohub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - allohub

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    image: allohub-back:latest
    container_name: allohub-back
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-allohub}
      DB_USER: ${DB_USER:-allohub}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ALLOC_OPERATOR_TOKEN: ${ALLOC_OPERATOR_TOKEN:-operator-dev-token}
      ALLOC_ADMIN_TOKEN: ${ALLOC_ADMIN_TOKEN:-admin-dev-token}
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s
    networks:
      - allohub

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/allohub}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/allohub/api}
        BACKEND_URL: ${BACKEND_URL:-http://back:8080}
    image: allohub-front:latest
    container_name: allohub-front
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/allohub}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/allohub/api}
      BACKEND_URL: ${BACKEND_URL:-http://back:8080}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/allohub/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - allohub

  nginx:
    image: nginx:1.27-alpine
    container_name: allohub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/allohub/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - allohub

volumes:
  allohub_pg_data:

networks:
  allohub:
    name: allohub
