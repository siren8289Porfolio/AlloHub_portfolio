# 통합 테스트 = 운영과 동일하게 PostgreSQL
# CI: GitHub Actions services.postgres (localhost:5432, user=postgres)
# 로컬: docker compose -f docker-compose.test.yml up -d
spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/allohub_test
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

allochub:
  ai:
    # Integration tests assert graceful degradation without a running FastAPI process.
    enabled: true
    base-url: http://127.0.0.1:1
    connect-timeout-ms: 200
    read-timeout-ms: 200

logging:
  level:
    org.hibernate.SQL: debug
    com.allochub.ai: warn
