server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: allochub
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:sqlite:file:./data/dev.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

allochub:
  auth:
    operator-token: ${ALLOC_OPERATOR_TOKEN:operator-dev-token}
    admin-token: ${ALLOC_ADMIN_TOKEN:admin-dev-token}
  ai:
    enabled: ${ALLOC_AI_ENABLED:true}
    base-url: ${ALLOC_AI_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${ALLOC_AI_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ALLOC_AI_READ_TIMEOUT_MS:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
