spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:allohub}
    # DB_HOST=db (compose service name)
    username: ${DB_USER:allohub}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

allochub:
  ai:
    enabled: ${ALLOC_AI_ENABLED:true}
    base-url: ${ALLOC_AI_BASE_URL:http://allohub-ai:8000}
    connect-timeout-ms: ${ALLOC_AI_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ALLOC_AI_READ_TIMEOUT_MS:3000}
