# 로컬 통합 테스트용 PostgreSQL (호스트 5432가 점유된 경우 5433 사용)
# 사용:
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DB_PORT=5433 ./gradlew -p back test

services:
  postgres:
    image: postgres:16
    container_name: allohub-test-pg
    environment:
      POSTGRES_DB: allohub_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allohub_test"]
      interval: 5s
      timeout: 5s
      retries: 10
